daemon:
servarrs:
  Sonarr:
    url: "http://localhost:8989"
    api-key: ""
    type: "sonarr"
  Radarr:
    url: "http://localhost:7878"
    api-key: ""
    type: "radarr"
download-clients:
  Transmission:
    url: "http://transmission:secret@localhost:9091/transmission/"
    max-download-bandwidth: 100
    min-download-time-margin: 600
indexers:
  hostnames:
    ExamplePrivateTracker:
      - "tracker.example.com"
  reviews:
    - name: "ExamplePrivateTracker"
      operations:
        - type: "or"
          operations:
            - type: "value"
              template: "{{item.status}}"
              equals: "seeding"
            - type: "value"
              template: "{{item.age}}"
              maximum: 604800
            - type: "value"
              template: "{{item.seconds_downloading}}"
              maximum: 0
            - type: "value"
              template: "{{item.rate_total}}"
              minimum: 50
          remove: true
          blacklist: true
        - type: "files"
          template: "{{file.size}}"
          path-patterns:
            - ".+\\.rar$"
            - ".+\\.r[0-9]+$"
            - ".+\\.zip$"
            - ".+\\.zip\\.[0-9]+$"
            - ".+\\.gz$"
            - ".+\\.tgz$"
            - ".+\\.bz2$"
          aggregation: "portion"
          maximum: 0.50
          remove: true
          blacklist: true
        - type: "value"
          template: "{{item.bandwidthPriority}}"
          equals: 1
          change:
            bandwidthPriority: 1
    - name: null
      operations:
        - type: "or"
          operations:
            - type: "value"
              template: "{{item.status}}"
              equals: "seeding"
            - type: "value"
              template: "{{item.age}}"
              maximum: 604800
            - type: "value"
              template: "{{item.seconds_downloading}}"
              maximum: 0
            - type: "value"
              template: "{{item.rate_total}}"
              minimum: 50
          remove: true
          blacklist: true
        - type: "files"
          template: "{{file.size}}"
          path-patterns:
            - ".+\\.rar$"
            - ".+\\.r[0-9]+$"
            - ".+\\.zip$"
            - ".+\\.zip\\.[0-9]+$"
            - ".+\\.gz$"
            - ".+\\.tgz$"
            - ".+\\.bz2$"
          aggregation: "portion"
          maximum: 0.50
          remove: true
          blacklist: true
        - type: "value"
          template: "{{item.bandwidthPriority}}"
          equals: -1
          change:
            bandwidthPriority: -1
  priorities:
    - name: "ExamplePrivateTracker"
      operations:
        - type: "or"
          filter: true
          operations:
            - type: "value"
              template: "{{item.seconds_since_done}}"
              minimum: 864000
            - type: "value"
              template: "{{item.ratio}}"
              minimum: 1.0
        - type: "files"
          template: "{{file.size}}"
          filter-attrs:
            - "is_imported"
          aggregation: "portion"
          reversed: true
          filter: true
          minimum: 0.9
        - type: "value"
          template: "{{item.uploadedEver}}"
          reversed: true
        - type: "value"
          template: "{{item.size_when_done}}"
          minimum: 10737418240
          reversed: true
        - type: "value"
          template: "{{item.size_when_done}}"
    - name: null
      operations:
        - type: "files"
          template: "{{file.size}}"
          filter-attrs:
            - "is_imported"
          aggregation: "portion"
          reversed: true
        - type: "value"
          template: "{{item.ratio}}"
