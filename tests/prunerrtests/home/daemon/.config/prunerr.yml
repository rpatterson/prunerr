servarrs:
  Sonarr:
    url: "http://localhost:8989"
    api-key: ""
    type: "sonarr"
  Radarr:
    url: "http://localhost:7878"
    api-key: ""
    type: "radarr"
download-clients:
  Transmission:
    url: "http://transmission:secret@localhost:9091/transmission/"
    max-download-bandwidth: 100
    min-download-time-margin: 600
indexers:
  ExamplePrivateTracker:
    hostnames:
      - "tracker.example.com"
stages:
  queued:
    archives:
      include: |
        {%- set archive_portion = 0 -%}
        {%- if item.size_selected -%}
            {%-
                set archive_portion = (
                    item.files|selectattr("selected")|selectattr(
                        "path.suffix",
                        "match",
                        "\\.(rar|r[0-9]+|zipx?|zip\\.[0-9]+|gz|tgz|bz2)",
                    )|sum("size") / item.size_selected
                )
            -%}
        {%- endif -%}
        {{- archive_portion > 0.50 -}}
      de-queue:
        blocklist: true
      remove: true
  all:
    stalled:
      include: |
        {{-
            item.status == "downloading"
            and (
                item.download_client.download_dir in item.download_dir.parents
                or item.download_client.download_dir == item.download_dir
            )
            and item.seconds_downloading > 604800
            and item.age > 604800
            and item.rate_total < 50
        -}}
      de-queue:
        blocklist: true
      remove: true
  free-space:
    prune:
      include: |
        {%- set wanted_sum = item.files|selectattr("selected")|sum("size") -%}
        {%- set imported_portion = 0 -%}
        {%- if wanted_sum -%}
            {%-
                set imported_portion = (
                    wanted_files|selectattr("is_imported")|sum("size")
                    / wanted_sum
                )
            -%}
        {%- endif -%}
        {%- set seeding_time_margin = 24 * 60 * 60 -%}
        {{
            imported_portion < 0.80
            and (
                item.ratio >= item.indexer_config["seeding-ratio"]|default(0.0)
                or item.seconds_since_done
                >= item.indexer_config["seeding-time"]|default(0)
            )
        }}
      sort: |
        {%- set wanted_sum = item.files|selectattr("selected")|sum("size") -%}
        {%- set imported_portion = 0 -%}
        {%- if wanted_sum -%}
            {%-
                set imported_portion = (
                    wanted_files|selectattr("is_imported")|sum("size")
                    / wanted_sum
                )
            -%}
        {%- endif -%}
        {{- (
            item.bandwidth_priority,
            item.indexer_config is true,
            -item.indexer_config["priority"]|default(45),
            imported_portion,
        ) -}}
      remove: true
      break: |
        {{ item.download_client.free_space_check() }}
daemon:
