servarrs:
  Sonarr:
    url: "http://localhost:8989"
    api-key: ""
    type: "sonarr"
  Radarr:
    url: "http://localhost:7878"
    api-key: ""
    type: "radarr"
download-clients:
  Transmission:
    url: "http://transmission:secret@localhost:9091/transmission/"
indexers:
  hostnames:
    ExamplePrivateTracker:
      - "tracker.private.example.com"
  reviews:
    - name: "ExamplePrivateTracker"
      operations:
        - type: "or"
          operations:
            - type: "value"
              template: "{{item.status}}"
              equals: "seeding"
            - type: "value"
              template: "{{item.age}}"
              maximum: 604800
            - type: "value"
              template: "{{item.seconds_downloading}}"
              maximum: 0
            - type: "value"
              template: "{{item.rate_total}}"
              minimum: 50
          remove: true
        - type: "value"
          template: "{{item.bandwidthPriority}}"
          equals: 1
